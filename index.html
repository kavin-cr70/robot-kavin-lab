<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Kavin Lab</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fe;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            color: #1a2b4c;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #556b8d;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.2s;
            margin: 8px;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            color: #2563eb;
            font-weight: 700;
        }

        .close-btn {
            background: white;
            color: #2563eb;
            border: 2px solid #2563eb;
            padding: 8px 30px;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        .close-btn:hover {
            background: #2563eb;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Kavin Lab!</h1>
        <p class="subtitle">"Hi there! I'm Robo-Guide, and I'm super excited to teach you how to build your very first AI!"</p>

        <!-- Buttons -->
        <button class="btn" onclick="openLeaderboard()">🏆 View Live Leaderboard</button>
        <button class="btn" onclick="submitTestScore()">➕ Submit My Score</button>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboardModal" class="modal">
        <div class="modal-content">
            <h2>🏆 Live Leaderboard</h2>
            <p style="color: #4b5563; font-size: 14px;">Top Robotics & AI Students (Ranked by Score & Speed)</p>

            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <tr><td colspan="3">Loading scores...</td></tr>
                </tbody>
            </table>

            <button class="close-btn" onclick="closeLeaderboard()">Close</button>
        </div>
    </div>

    <script>
        function openLeaderboard() {
            document.getElementById('leaderboardModal').style.display = 'flex';
            fetchLeaderboard();
        }

        function closeLeaderboard() {
            document.getElementById('leaderboardModal').style.display = 'none';
        }

        // Fetch scores from Flask API
        function fetchLeaderboard() {
            fetch('/api/leaderboard')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('leaderboardBody');
                    tbody.innerHTML = '';

                    if (!data || data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3">No scores recorded yet!</td></tr>';
                        return;
                    }

                    data.forEach((entry, index) => {
                        let rankText = (index + 1);
                        if (index === 0) rankText = '🥇 1st';
                        else if (index === 1) rankText = '🥈 2nd';
                        else if (index === 2) rankText = '🥉 3rd';

                        const row = `<tr>
                            <td><strong>${rankText}</strong></td>
                            <td>${entry.name}</td>
                            <td><strong>${entry.score}</strong></td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                })
                .catch(err => {
                    console.error('Error fetching leaderboard:', err);
                    document.getElementById('leaderboardBody').innerHTML = '<tr><td colspan="3">Error loading scores.</td></tr>';
                });
        }

        // Submit a new score to Flask API
        function submitTestScore() {
            const name = prompt("Enter your name:", "kavin");
            const score = prompt("Enter your score:", "100");

            if (name && score) {
                fetch('/api/leaderboard', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, score: parseInt(score) })
                })
                .then(res => res.json())
                .then(() => {
                    alert("Score submitted!");
                    openLeaderboard();
                });
            }
        }
    </script>
</body>
</html>
